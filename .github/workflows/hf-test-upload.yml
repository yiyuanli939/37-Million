name: Hugging Face test upload

on:
  push:
    branches: [claude/project-thread-3w249w]
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q huggingface_hub
      - name: Upload test file
        env:
          HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          python - <<'PY'
          import os, datetime
          from huggingface_hub import HfApi
          token = os.environ.get("HF_TOKEN")
          if not token:
              raise SystemExit("HUGGINGFACE_TOKEN secret is empty or not available to this workflow")
          api = HfApi(token=token)
          repo_id = "TimaeusWorld/37-Million-Words"
          repo_type = next((t for t in ("dataset", "model", "space") if api.repo_exists(repo_id, repo_type=t)), None)
          if repo_type is None:
              raise SystemExit(f"{repo_id} not found (or not visible to this token)")
          content = f"Test upload from GitHub Actions at {datetime.datetime.now(datetime.timezone.utc).isoformat()}\n"
          api.upload_file(path_or_fileobj=content.encode(), path_in_repo="test.txt",
                          repo_id=repo_id, repo_type=repo_type, commit_message="Test upload")
          prefix = {"dataset": "datasets/", "space": "spaces/"}.get(repo_type, "")
          print(f"UPLOADED ({repo_type}): https://huggingface.co/{prefix}{repo_id}/blob/main/test.txt")
          PY
