name: 排版发布

# 会话不能推送标签，所以用发布队列文件 releases.txt 触发：
#   每行一卷："V0001" 表示正式发布（标签 v0001），"V0001 sample" 表示试样（只排已译作品，预发布）。
# 推送改动了 releases.txt 的提交时，排出队列中尚未发布的卷，发布到 Releases，并同步到 Hugging Face。
on:
  push:
    branches: [main, "claude/**"]
    paths: [releases.txt]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装字体和工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-gfs-porson fonts-gfs-didot
          pip install -q typst==0.15.0 huggingface_hub pyarrow
      - name: 排版、发布、同步
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
        run: |
          set -euo pipefail
          short=$(git rev-parse --short HEAD)
          commit7=$(grep commit= source.lock | cut -c8-14)
          grep -v '^\s*#' releases.txt | while read -r vol kind rid; do
            [ -z "$vol" ] && continue
            redo=""
            if [ "$kind" = "sample" ]; then
              tag="sample-$vol-$short"; flags="--allow-partial --skip-untranslated"; pre="--prerelease"
            else
              tag="v${vol#V}"; flags=""; pre=""
            fi
            # "V0001 rebuild <批次号>"：已发布的卷按当前译文重排一次；发布说明里记下批次号，同一批次不重复重排
            if [ "$kind" = "rebuild" ] && [ -n "$rid" ]; then
              redo="重排批次 $rid。"
              if gh release view "$tag" --json body -q .body 2>/dev/null | grep -F "$redo" >/dev/null; then echo "$tag 已按批次 $rid 重排，跳过"; continue; fi
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            fi
            if d=$(gh release view "$tag" --json isDraft -q .isDraft 2>/dev/null); then
              if [ "$d" = "true" ]; then echo "$tag 只留下草稿（上次发布中断），删除后重发"; gh release delete "$tag" --yes --cleanup-tag || true
              else echo "$tag 已发布，跳过"; continue; fi
            fi
            wids=$(python3 -c "
          import csv
          v={r['volume']:r for r in csv.DictReader(open('volumes.csv',encoding='utf-8'))}['$vol']
          print(' '.join(sorted({p.split('@')[0] for p in v['parts'].split(';') if p})))")
            python3 tools/fetch_source.py $wids
            rm -rf out && python3 tools/build_volume.py "$vol" --out out $flags
            title=$(python3 -c "import sys; sys.path.insert(0,'tools'); import build_volume as b; print(b.volume_titles()['$vol'])")
            [ -n "$pre" ] && title="$title（试样）"
            notes="《古希腊文献希中对照全译》$vol：$title。希腊文—中文对照，AI 翻译、AI 审校，未经人工校订。底本 Eulogikon（提交 $commit7）。附对齐数据 JSONL。$redo"
            gh release create "$tag" out/$vol.pdf out/$vol.jsonl --target "$GITHUB_SHA" --title "$vol $title" --notes "$notes" $pre
            gh release list --limit 1000 --json tagName,isPrerelease > releases.json
            if [ -n "${HF_TOKEN:-}" ]; then TAG="$tag" python3 tools/sync_hf.py out releases.json; else echo "没有 HUGGINGFACE_TOKEN，跳过同步"; fi
          done
